            .dots-nav { bottom: 10px; }
            .nav-arrow { display: none; }
            #lightbox-img { max-height: 80vh; width: auto; }
        }

    <script nonce="jd2026secure">
        (function () {
            'use strict';

            const CONFIG = {
                WHEEL_THRESHOLD: { LIGHTBOX: 400, SLIDER: 25 },
                SWIPE_THRESHOLD: 10,
                TIMING: {
                    SLIDE_TRANSITION: 1200,
                    LIGHTBOX_FADE_OUT: 300,
                    LIGHTBOX_FADE_IN: 350,
                    LIGHTBOX_CLOSE: 500,
                    WHEEL_RESET: 100,
                    WHEEL_RESET_SLIDER: 50,
                    LOADING_DELAY: 500,
                    LIGHTBOX_SHOW: 10
                }
            };

            const GALLERY_DATA = Object.freeze([
                Object.freeze({ id: 'A', images: Object.freeze(['assets/A1.webp', 'assets/A2.webp', 'assets/A4.webp', 'assets/A3.webp']) }),
                Object.freeze({ id: 'B', images: Object.freeze(['assets/B1.webp', 'assets/B2.webp', 'assets/B4.webp', 'assets/B3.webp']) }),
                Object.freeze({ id: 'C', images: Object.freeze(['assets/C1.webp', 'assets/C2.webp', 'assets/C3.webp', 'assets/C4.webp']) })
            ]);

            const isSafeAssetPath = (path) => typeof path === 'string' && /^assets\/[A-Za-z0-9_\-]+\.webp$/.test(path);

            const STATE = {
                currentSlide: 0,
                slideCount: GALLERY_DATA.length,
                isMoving: false,
                lbIndex: 0,
                isLbMoving: false,
                preloadedIdx: new Set(),
                startX: 0,
                isDragging: false,
                isTouch: false
            };

            const DOM = {
                slider: document.getElementById('slider'),
                dotsContainer: document.querySelector('.dots-nav'),
                lightbox: document.getElementById('lightbox'),
                lightboxImg: document.getElementById('lightbox-img'),
                menu: document.getElementById('dropdown-menu'),
                loader: document.getElementById('loading-screen')
            };

            function preloadSlide(idx) {
                const target = (idx + STATE.slideCount) % STATE.slideCount;
                if (STATE.preloadedIdx.has(target)) return;
                GALLERY_DATA[target].images.forEach(src => {
                    if (isSafeAssetPath(src)) {
                        const img = new Image();
                        img.src = src;
                    }
                });
                STATE.preloadedIdx.add(target);
            }

            function createSeriesSection(series, isActive) {
                const article = document.createElement('article');
                article.className = `series-section${isActive ? ' active' : ''}`;

                const h2 = document.createElement('h2');
                h2.className = 'visually-hidden';
                h2.textContent = `Photography Series ${series.id}`;
                article.appendChild(h2);

                const container = document.createElement('div');
                container.className = 'masonry-container';

                const prevArrow = document.createElement('div');
                prevArrow.className = 'nav-arrow arrow-prev';
                container.appendChild(prevArrow);

                [[0, 1], [2, 3]].forEach(pair => {
                    const col = document.createElement('div');
                    col.className = 'masonry-col';
                    pair.forEach(imgIdx => {
                        const src = series.images[imgIdx];
                        if (!isSafeAssetPath(src)) return;
                        const item = document.createElement('div');
                        item.className = 'photo-item';
                        const img = document.createElement('img');
                        img.src = src;
                        img.alt = `Photography work - Series ${series.id}, Image ${imgIdx + 1}`;
                        item.appendChild(img);
                        col.appendChild(item);
                    });
                    container.appendChild(col);
                });

                const nextArrow = document.createElement('div');
                nextArrow.className = 'nav-arrow arrow-next';
                container.appendChild(nextArrow);

                article.appendChild(container);
                return article;
            }

            function initGallery() {
                const sliderFrag = document.createDocumentFragment();
                const dotsFrag = document.createDocumentFragment();

                GALLERY_DATA.forEach((series, idx) => {
                    sliderFrag.appendChild(createSeriesSection(series, idx === 0));

                    const wrapper = document.createElement('div');
                    wrapper.className = 'dot-wrapper';
                    wrapper.dataset.index = String(idx);
                    const dot = document.createElement('div');
                    dot.className = `dot${idx === 0 ? ' active' : ''}`;
                    wrapper.appendChild(dot);
                    dotsFrag.appendChild(wrapper);
                });

                DOM.slider.appendChild(sliderFrag);
                DOM.dotsContainer.appendChild(dotsFrag);

                preloadSlide(0);
                preloadSlide(1);
            }

            function updateSlider() {
                DOM.slider.style.transform = `translate3d(${-STATE.currentSlide * 100}vw, 0, 0)`;

                document.querySelectorAll('.series-section').forEach((el, i) =>
                    el.classList.toggle('active', i === STATE.currentSlide)
                );
                document.querySelectorAll('.dot').forEach((el, i) =>
                    el.classList.toggle('active', i === STATE.currentSlide)
                );

                preloadSlide(STATE.currentSlide + 1);
                setTimeout(() => { STATE.isMoving = false; }, CONFIG.TIMING.SLIDE_TRANSITION);
            }

            function moveSlide(direction) {
                if (STATE.isMoving || DOM.lightbox.classList.contains('show')) return;
                STATE.isMoving = true;
                STATE.currentSlide = (STATE.currentSlide + direction + STATE.slideCount) % STATE.slideCount;
                updateSlider();
            }

            function openLightbox(imgEl) {
                const src = imgEl.getAttribute('src');
                if (!isSafeAssetPath(src)) return;

                const currentImages = GALLERY_DATA[STATE.currentSlide].images;
                const found = currentImages.indexOf(src);
                STATE.lbIndex = found >= 0 ? found : 0;

                DOM.lightboxImg.src = currentImages[STATE.lbIndex];
                DOM.lightboxImg.style.opacity = '1';
                DOM.lightboxImg.alt = `Series ${GALLERY_DATA[STATE.currentSlide].id} - Photo ${STATE.lbIndex + 1}`;
                DOM.lightbox.style.display = 'flex';
                STATE.isMoving = false;
                STATE.isLbMoving = false;

                setTimeout(() => DOM.lightbox.classList.add('show'), CONFIG.TIMING.LIGHTBOX_SHOW);
            }

            function changeLbImg(direction) {
                if (STATE.isLbMoving) return;
                STATE.isLbMoving = true;

                DOM.lightboxImg.style.opacity = '0';
                setTimeout(() => {
                    const currentImages = GALLERY_DATA[STATE.currentSlide].images;
                    STATE.lbIndex = (STATE.lbIndex + direction + currentImages.length) % currentImages.length;
                    const nextSrc = currentImages[STATE.lbIndex];

                    if (!isSafeAssetPath(nextSrc)) {
                        STATE.isLbMoving = false;
                        return;
                    }

                    DOM.lightboxImg.src = nextSrc;
                    DOM.lightboxImg.alt = `Series ${GALLERY_DATA[STATE.currentSlide].id} - Photo ${STATE.lbIndex + 1}`;
                    DOM.lightboxImg.style.opacity = '1';
                    setTimeout(() => { STATE.isLbMoving = false; }, CONFIG.TIMING.LIGHTBOX_FADE_IN);
                }, CONFIG.TIMING.LIGHTBOX_FADE_OUT);
            }

            function closeLightbox() {
                DOM.lightbox.classList.remove('show');
                setTimeout(() => { DOM.lightbox.style.display = 'none'; }, CONFIG.TIMING.LIGHTBOX_CLOSE);
            }

            function bindEvents() {
                document.addEventListener('click', (e) => {
                    if (e.target.closest('[data-action="toggle-menu"]')) {
                        DOM.menu.classList.toggle('show');
                        return;
                    }
                    if (e.target.classList.contains('arrow-prev')) { moveSlide(-1); return; }
                    if (e.target.classList.contains('arrow-next')) { moveSlide(1); return; }

                    const photo = e.target.closest('.photo-item');
                    if (photo) {
                        const img = photo.querySelector('img');
                        if (img) openLightbox(img);
                        return;
                    }

                    const dot = e.target.closest('.dot-wrapper');
                    if (dot) {
                        const idx = parseInt(dot.dataset.index, 10);
                        if (!isNaN(idx) && idx >= 0 && idx < STATE.slideCount) {
                            STATE.currentSlide = idx;
                            updateSlider();
                        }
                    }
                });

                const dragStart = (e) => {
                    if (e.type === 'touchstart') STATE.isTouch = true;
                    if (e.type === 'mousedown' && STATE.isTouch) return;
                    if (STATE.isMoving) return;
                    STATE.isDragging = true;
                    STATE.startX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;

                    if (!STATE.isDragging) return;

                    if (Math.abs(diffX) > CONFIG.SWIPE_THRESHOLD) {
                        const dir = diffX > 0 ? 1 : -1;
                        DOM.lightbox.classList.contains('show') ? changeLbImg(dir) : moveSlide(dir);
                    }
                };

                let wheelAccum = 0;
                let wheelTimer;

                document.addEventListener('wheel', (e) => {
                    const isLB = DOM.lightbox.classList.contains('show');
                    const isSlider = e.target.closest('.slider-viewport');

                    if ((isLB || isSlider) && Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
                        e.preventDefault();
                    }

                    if (isLB) {
                        if (STATE.isLbMoving) { wheelAccum = 0; return; }
                        wheelAccum += e.deltaX;
                        if (Math.abs(wheelAccum) > CONFIG.WHEEL_THRESHOLD.LIGHTBOX) {
                            changeLbImg(wheelAccum > 0 ? 1 : -1);
                            wheelAccum = 0;
                        }
                        clearTimeout(wheelTimer);
                        wheelTimer = setTimeout(() => { wheelAccum = 0; }, CONFIG.TIMING.WHEEL_RESET);
                        return;
                    }

                    if (STATE.isMoving || !isSlider) return;
                    wheelAccum += e.deltaX;
                    if (Math.abs(wheelAccum) > CONFIG.WHEEL_THRESHOLD.SLIDER) {
                        moveSlide(wheelAccum > 0 ? 1 : -1);
                        wheelAccum = 0;

                        wheelTimer = setTimeout(() => { wheelAccum = 0; }, CONFIG.TIMING.WHEEL_RESET_SLIDER);
                    }

                window.addEventListener('mousedown', dragStart);
                window.addEventListener('mouseup', dragEnd);
                window.addEventListener('touchstart', dragStart, { passive: true });
                window.addEventListener('touchend', dragEnd, { passive: true });

                document.getElementById('lb-prev-btn').addEventListener('click', (e) => { e.stopPropagation(); changeLbImg(-1); });
                document.getElementById('lb-next-btn').addEventListener('click', (e) => { e.stopPropagation(); changeLbImg(1); });
                DOM.lightbox.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('lb-arrow')) closeLightbox();
                });

                document.addEventListener('keydown', (e) => {
                    const isLB = DOM.lightbox.classList.contains('show');
                    if (e.key === 'ArrowRight') isLB ? changeLbImg(1) : moveSlide(1);
                    if (e.key === 'ArrowLeft') isLB ? changeLbImg(-1) : moveSlide(-1);

                    if (isCtrl && ['s', 'S', 'u', 'U'].includes(e.key)) e.preventDefault();
                    if (isCtrl && e.shiftKey && ['i', 'I'].includes(e.key)) e.preventDefault();
                });

                document.addEventListener('contextmenu', (e) => e.preventDefault());
                document.addEventListener('dragstart', (e) => {
                    if (e.target.tagName === 'IMG') e.preventDefault();
                });
            }

            initGallery();
            bindEvents();

            window.addEventListener('load', () => {
                setTimeout(() => { DOM.loader.classList.add('fade-out'); }, CONFIG.TIMING.LOADING_DELAY);
            });
        })();
    </script>
</body>

</html>
