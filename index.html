    <!-- ✅ [보안 1] Content Security Policy: 허용된 출처만 리소스 로드 허용 -->
    <!-- frame-ancestors 'none' → Clickjacking 방어 -->
    <!-- script-src 'self' → 인라인 스크립트 외 외부 JS 차단 (nonce 방식으로 인라인 허용) -->
    <meta http-equiv="Content-Security-Policy"
        content="
            default-src 'self';
            script-src 'self' 'nonce-jd2026secure';
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            font-src https://fonts.gstatic.com;
            img-src 'self' data:;
            connect-src 'none';
            frame-ancestors 'none';
            base-uri 'self';
            form-action 'none';
        ">

    <!-- ✅ [보안 2] Referrer-Policy: 외부 링크 클릭 시 URL 정보 누출 차단 -->

    <!-- ✅ [보안 3] X-Content-Type-Options: MIME 스니핑 방어 (meta로 의도 명시, 서버에서도 설정 권장) -->

    <style>
        html, body {
            height: 100%;
            height: -webkit-fill-available;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .loading-logo {
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            animation: pulse 1s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        #loading-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        :root {
            --bg-image: url('../assets/000001.webp');
            --interface-color: #FFFFFF;
            --spacing: 30px;
            --photo-gap: 20px;
            --container-max-width: 65vh;
            --arrow-distance: -150px;
            --transition-speed: 1.2s;
            --transition-timing: cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        body, html {
            background-color: #000; color: var(--interface-color);
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            overflow: hidden; height: 100%; position: fixed; width: 100%;
            overscroll-behavior-x: auto;
        }

        .masonry-container, #lightbox {
            overscroll-behavior-x: none;
            touch-action: pan-y;
        }

        .slider-viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            overscroll-behavior-x: none;
        }
        img {
            -webkit-user-drag: none; user-drag: none;
            /* ✅ [보안 11] iOS 길게 누르기 → 이미지 저장 메뉴 차단 */
            -webkit-touch-callout: none;
            pointer-events: none; /* JS에서 클릭은 오버레이가 처리 */
        }
        .menu-content { user-select: text !important; -webkit-user-select: text !important; cursor: auto; }

        /* ✅ [보안 11] photo-item 오버레이: 이미지 위를 투명 레이어로 덮어 우클릭/드래그 원천 차단 */
        .photo-item {
            position: relative;
            cursor: pointer;
        }
        .photo-item::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1; /* 이미지 위를 덮음 */
            background: transparent;
        }

        .bg-fixed {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            height: 100%;
            min-height: -webkit-fill-available;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            z-index: -2;
            margin-bottom: -1px;
        }

        nav {
            position: fixed; top: var(--spacing); left: var(--spacing);
            z-index: 2000; display: flex; flex-direction: column; gap: 0;
        }
        .logo {
            font-size: 1.5rem;
            letter-spacing: 0.015em;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.3s;
            z-index: 2010;
            font-weight: 200;
        }
        .logo:active { opacity: 0.5; }
        .menu-container {
            max-height: 0; overflow: hidden; opacity: 0;
            transition: max-height 0.7s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, margin-top 0.7s ease;
            pointer-events: none;
        }
        .menu-container.show { max-height: 500px; opacity: 1; pointer-events: auto; margin-top: 30px; }
        .menu-item { margin-bottom: 25px; }
        .menu-label { font-size: 0.68rem; opacity: 0.4; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; display: block; font-weight: 100; }
        .menu-content { font-size: 0.85rem; line-height: 1.6; opacity: 0.9; font-weight: 100; }

        .horizontal-wrapper { display: flex; height: 100vh; transition: transform var(--transition-speed) var(--transition-timing); }
        .series-section { flex: 0 0 100vw; width: 100vw; display: flex; justify-content: center; align-items: center; opacity: 0.15; transition: opacity 1.3s ease; }
        .series-section.active { opacity: 1; }
        .masonry-container { display: flex; justify-content: center; align-items: center; gap: var(--photo-gap); width: 70vw; max-width: var(--container-max-width); position: relative; }
        .masonry-col { display: flex; flex-direction: column; gap: var(--photo-gap); flex: 1; }
        .photo-item img { width: 100%; height: auto; display: block; cursor: pointer; }

        .nav-arrow { position: absolute; top: 50%; width: 50px; height: 50px; cursor: pointer; z-index: 1000; opacity: 0.2; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .nav-arrow::before { content: ''; width: 10px; height: 10px; border-top: 1px solid #fff; border-right: 1px solid #fff; }
        .arrow-prev { left: var(--arrow-distance); transform: translateY(-50%) rotate(-135deg); }
        .arrow-next { right: var(--arrow-distance); transform: translateY(-50%) rotate(45deg); }

        .dots-nav { position: fixed; bottom: calc(45px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; z-index: 1000; }
        .dot-wrapper { padding: 15px 10px; cursor: pointer; }
        .dot { width: 4px; height: 4px; border-radius: 50%; border: 1px solid #fff; opacity: 0.2; transition: 0.4s; pointer-events: none; }
        .dot.active { background-color: #fff; opacity: 0.9; transform: scale(1.2); }

        #lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); display: none; justify-content: center; align-items: center; z-index: 3000; opacity: 0; transition: opacity 0.5s; cursor: pointer; }
        #lightbox.show { display: flex; opacity: 1; }
        #lightbox-img { max-width: 90%; max-height: 90vh; object-fit: contain; z-index: 3050; transition: opacity 0.4s ease; }

        .lb-arrow {
            position: absolute; top: 0; bottom: 0;
            width: 15vw; min-width: 80px;
            display: flex; align-items: center; justify-content: center;
            z-index: 3600; transition: opacity 0.3s; opacity: 0.2; cursor: pointer;
        }
        .lb-arrow::after {
            content: ''; width: 15px; height: 15px;
            border-top: 1.5px solid #fff; border-right: 1.5px solid #fff; display: block;
        }
        .lb-prev { left: 0; justify-content: flex-start; padding-left: 30px; }
        .lb-prev::after { transform: rotate(-135deg); }
        .lb-next { right: 0; justify-content: flex-end; padding-right: 30px; }
        .lb-next::after { transform: rotate(45deg); }

        #lightbox:hover .lb-arrow { opacity: 0.4; }
        .lb-arrow:hover { opacity: 1 !important; }

        footer { position: fixed; bottom: calc(var(--spacing) + env(safe-area-inset-bottom)); right: var(--spacing); font-size: 0.6rem; opacity: 0.3; }

        .visually-hidden {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        @media (max-width: 850px) and (orientation: portrait) {
            :root { --spacing: 15px; --photo-gap: 10px; }
            nav { flex-direction: row; align-items: flex-start; gap: 11px; }
            .logo { font-size: 1.3rem; }
            .menu-container.show { margin-top: 5px; }
            .bg-fixed { width: 100vh; height: 100vw; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(90deg); }
            .masonry-container { width: 70vw; margin-top: 45px; }
            .nav-arrow, .lb-arrow { display: none; }
            .menu-item { margin-bottom: 15px; }
            .menu-label { margin-bottom: 4px; }
            .menu-content { line-height: 1.4; font-size: 0.8rem; }
            .dots-nav { bottom: calc(30px + env(safe-area-inset-bottom)); }
        }

        @media (max-device-width: 930px) and (orientation: landscape) {
            :root { --spacing: 12px; --photo-gap: 8px; }
            .menu-content { font-size: 0.7rem; line-height: 1.4; }
            .menu-label { font-size: 0.6rem; }
            .series-section { height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; }
            .masonry-container { width: auto; height: 50vh; max-width: 70vw; display: flex; flex-direction: row; gap: var(--photo-gap); margin: 0 auto; transform: translateY(-30px); }
            .masonry-col { height: 100%; display: flex; flex-direction: column; justify-content: center; flex: 0 1 auto; gap: var(--photo-gap); }
            .photo-item { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
            .photo-item img { height: auto; width: auto; max-height: calc(30vh - 20px); max-width: 100%; object-fit: contain; }
            nav { top: 10px; left: calc(var(--spacing) + env(safe-area-inset-left)); }
            .logo { font-size: 1rem; }
            .dots-nav { bottom: 10px; }
            .nav-arrow { display: none; }
            #lightbox-img { max-height: 80vh; width: auto; }
        }
    </style>
</head>

    <!-- ✅ [보안 1] nonce 속성: CSP의 script-src nonce와 매칭되어 이 인라인 스크립트만 허용 -->
    <script nonce="jd2026secure">
        (function () {
            const CONFIG = {
                WHEEL_THRESHOLD: { LIGHTBOX: 400, SLIDER: 25 },
                SWIPE_THRESHOLD: 10,
                TIMING: {
                    SLIDE_TRANSITION: 1200,
                    LIGHTBOX_FADE_OUT: 300,
                    LIGHTBOX_FADE_IN: 350,
                    LIGHTBOX_CLOSE: 500,
                    WHEEL_RESET: 100,
                    WHEEL_RESET_SLIDER: 50,
                    LOADING_DELAY: 500,
                    LIGHTBOX_SHOW: 10
                },
                PRELOAD: { NEXT_SLIDE: 1, PREV_SLIDE: -1 }
            };

            // ✅ [보안 7] Object.freeze: 갤러리 데이터 런타임 오염 방지
            const GALLERY_DATA = Object.freeze([
                Object.freeze({ id: 'A', images: Object.freeze(['assets/A1.webp', 'assets/A2.webp', 'assets/A4.webp', 'assets/A3.webp']) }),
                Object.freeze({ id: 'B', images: Object.freeze(['assets/B1.webp', 'assets/B2.webp', 'assets/B4.webp', 'assets/B3.webp']) }),
                Object.freeze({ id: 'C', images: Object.freeze(['assets/C1.webp', 'assets/C2.webp', 'assets/C3.webp', 'assets/C4.webp']) })
            ]);

            // ✅ [보안 8] 허용된 이미지 경로 화이트리스트: 외부 URL 주입 차단
            const ALLOWED_IMG_PREFIX = 'assets/';
            function isSafeAssetPath(path) {
                return typeof path === 'string' &&
                    path.startsWith(ALLOWED_IMG_PREFIX) &&
                    !path.includes('..') &&
                    /^assets\/[A-Za-z0-9_\-]+\.webp$/.test(path);
            }

            const STATE = {
                currentSlide: 0, slideCount: GALLERY_DATA.length,
                isMoving: false,
                lbCurrentIndex: 0, lbImages: [], isLbMoving: false,
                preloadedIdx: new Set(),
                startX: 0, isDragging: false, isTouch: false
            };

            const DOM = {
                slider: document.getElementById('slider'),
                dotsContainer: document.querySelector('.dots-nav'),
                lightbox: document.getElementById('lightbox'),
                lightboxImg: document.getElementById('lightbox-img'),
                menu: document.getElementById('dropdown-menu')
            };

            function preloadSlide(idx) {
                const targetIdx = (idx + STATE.slideCount) % STATE.slideCount;
                if (STATE.preloadedIdx.has(targetIdx)) return;
                GALLERY_DATA[targetIdx].images.forEach(src => {
                    if (!isSafeAssetPath(src)) return; // ✅ [보안 8] 프리로드 경로도 검증
                    const img = new Image();
                    img.src = src;
                });
                STATE.preloadedIdx.add(targetIdx);
            }

            // ✅ [보안 9] innerHTML 제거: DOM API로 직접 생성 → XSS 원천 차단
            function createSeriesSection(series, isActive) {
                const article = document.createElement('article');
                article.className = 'series-section' + (isActive ? ' active' : '');

                const h2 = document.createElement('h2');
                h2.className = 'visually-hidden';
                h2.textContent = `Photography Series ${series.id}`; // textContent: HTML 삽입 불가
                article.appendChild(h2);

                const container = document.createElement('div');
                container.className = 'masonry-container';

                const prevArrow = document.createElement('div');
                prevArrow.className = 'nav-arrow arrow-prev';
                container.appendChild(prevArrow);

                // 두 컬럼: [0,1] / [2,3]
                [[0, 1], [2, 3]].forEach(([a, b]) => {
                    const col = document.createElement('div');
                    col.className = 'masonry-col';
                    [a, b].forEach((imgIdx) => {
                        const src = series.images[imgIdx];
                        if (!isSafeAssetPath(src)) return; // ✅ [보안 8] DOM 삽입 전 경로 검증
                        const item = document.createElement('div');
                        item.className = 'photo-item';
                        const img = document.createElement('img');
                        img.src = src;
                        img.alt = `Photography work - Series ${series.id}, Image ${imgIdx + 1}`;
                        item.appendChild(img);
                        col.appendChild(item);
                    });
                    container.appendChild(col);
                });

                const nextArrow = document.createElement('div');
                nextArrow.className = 'nav-arrow arrow-next';
                container.appendChild(nextArrow);

                article.appendChild(container);
                return article;
            }

            function createDotWrapper(idx, isActive) {
                const wrapper = document.createElement('div');
                wrapper.className = 'dot-wrapper';
                wrapper.dataset.index = String(idx); // dataset은 문자열로만 저장
                const dot = document.createElement('div');
                dot.className = 'dot' + (isActive ? ' active' : '');
                wrapper.appendChild(dot);
                return wrapper;
            }

            function initGallery() {
                // ✅ [보안 9] innerHTML 없이 DOM 구성
                const sliderFragment = document.createDocumentFragment();
                const dotsFragment = document.createDocumentFragment();

                GALLERY_DATA.forEach((series, idx) => {
                    sliderFragment.appendChild(createSeriesSection(series, idx === 0));
                    dotsFragment.appendChild(createDotWrapper(idx, idx === 0));
                });

                DOM.slider.innerHTML = ''; // 기존 정적 fallback 제거 후 교체
                DOM.slider.appendChild(sliderFragment);
                DOM.dotsContainer.innerHTML = '';
                DOM.dotsContainer.appendChild(dotsFragment);

                preloadSlide(0);
                preloadSlide(CONFIG.PRELOAD.NEXT_SLIDE);
            }

            function toggleMenu() { DOM.menu.classList.toggle('show'); }

            function updateSlider() {
                const offset = -STATE.currentSlide * 100;
                DOM.slider.style.transition = `transform var(--transition-speed) var(--transition-timing)`;
                DOM.slider.style.transform = `translate3d(${offset}vw, 0, 0)`;

                document.querySelectorAll('.series-section').forEach((s, i) => s.classList.toggle('active', i === STATE.currentSlide));
                document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === STATE.currentSlide));

                preloadSlide(STATE.currentSlide + CONFIG.PRELOAD.NEXT_SLIDE);
                setTimeout(() => { STATE.isMoving = false; }, CONFIG.TIMING.SLIDE_TRANSITION);
            }

            function moveSlide(d) {
                if (STATE.isMoving || DOM.lightbox.classList.contains('show')) return;
                STATE.isMoving = true;
                STATE.currentSlide = (STATE.currentSlide + d + STATE.slideCount) % STATE.slideCount;
                updateSlider();
            }

            function openLightbox(imgEl) {
                const srcAttr = imgEl.getAttribute('src');
                // ✅ [보안 8] 라이트박스 열기 전 경로 재검증
                if (!isSafeAssetPath(srcAttr)) return;

                STATE.lbImages = Array.from(GALLERY_DATA[STATE.currentSlide].images);
                const foundIdx = STATE.lbImages.indexOf(srcAttr);
                STATE.lbCurrentIndex = foundIdx >= 0 ? foundIdx : 0;

                DOM.lightboxImg.src = STATE.lbImages[STATE.lbCurrentIndex];
                DOM.lightboxImg.style.opacity = '1';
                DOM.lightboxImg.alt = `Series ${GALLERY_DATA[STATE.currentSlide].id} - Photo ${STATE.lbCurrentIndex + 1}`;
                DOM.lightbox.style.display = 'flex';
                STATE.isMoving = false;
                STATE.isLbMoving = false;
                setTimeout(() => DOM.lightbox.classList.add('show'), CONFIG.TIMING.LIGHTBOX_SHOW);
            }

            function changeLbImg(d) {
                if (STATE.isLbMoving) return;
                STATE.isLbMoving = true;

                DOM.lightboxImg.style.opacity = '0';
                setTimeout(() => {
                    STATE.lbCurrentIndex = (STATE.lbCurrentIndex + d + STATE.lbImages.length) % STATE.lbImages.length;
                    const nextSrc = STATE.lbImages[STATE.lbCurrentIndex];
                    // ✅ [보안 8] 이미지 전환 시에도 경로 검증
                    if (!isSafeAssetPath(nextSrc)) { STATE.isLbMoving = false; return; }
                    DOM.lightboxImg.src = nextSrc;
                    DOM.lightboxImg.alt = `Series ${GALLERY_DATA[STATE.currentSlide].id} - Photo ${STATE.lbCurrentIndex + 1}`;
                    DOM.lightboxImg.style.opacity = '1';
                    setTimeout(() => { STATE.isLbMoving = false; }, CONFIG.TIMING.LIGHTBOX_FADE_IN);
                }, CONFIG.TIMING.LIGHTBOX_FADE_OUT);
            }

            function closeLightbox() {
                DOM.lightbox.classList.remove('show');
                setTimeout(() => { DOM.lightbox.style.display = 'none'; }, CONFIG.TIMING.LIGHTBOX_CLOSE);
            }

            function bindEvents() {
                // ✅ [보안 5] data-action으로 로고 클릭 처리 (window 전역 함수 불필요)
                document.addEventListener('click', (e) => {
                    if (e.target.closest('[data-action="toggle-menu"]')) {
                        toggleMenu();
                        return;
                    }
                    if (e.target.classList.contains('arrow-prev')) { moveSlide(-1); return; }
                    if (e.target.classList.contains('arrow-next')) { moveSlide(1); return; }
                    if (e.target.tagName === 'IMG' && e.target.closest('.photo-item')) {
                        openLightbox(e.target);
                        return;
                    }
                    // ✅ [보안 11] 오버레이(::after)가 클릭을 가로채므로 photo-item 클릭도 처리
                    const photoItem = e.target.closest('.photo-item');
                    if (photoItem) {
                        const img = photoItem.querySelector('img');
                        if (img) { openLightbox(img); return; }
                    }
                    const dotWrapper = e.target.closest('.dot-wrapper');
                    if (dotWrapper) {
                        // ✅ [보안 10] 정수 검증: 범위 밖 인덱스 차단
                        const rawIdx = parseInt(dotWrapper.dataset.index, 10);
                        if (Number.isInteger(rawIdx) && rawIdx >= 0 && rawIdx < STATE.slideCount) {
                            STATE.currentSlide = rawIdx;
                            updateSlider();
                        }
                    }
                });

                const dragStart = (e) => {
                    if (e.type === 'touchstart') STATE.isTouch = true;
                    if (e.type === 'mousedown' && STATE.isTouch) return;
                    if (STATE.isMoving) return;
                    STATE.isDragging = true;
                    STATE.startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                };

                const dragEnd = (e) => {
                    if (!STATE.isDragging) return;
                    STATE.isDragging = false;
                    const endX = e.type.includes('touch') ? e.changedTouches[0].clientX : e.clientX;
                    const diffX = STATE.startX - endX;

                    if (Math.abs(diffX) > CONFIG.SWIPE_THRESHOLD) {
                        const direction = diffX > 0 ? 1 : -1;
                        if (DOM.lightbox.classList.contains('show')) changeLbImg(direction);
                        else moveSlide(direction);
                    }
                };

                let wheelAccumulated = 0;
                let wheelTimeout;

                document.addEventListener('wheel', (e) => {
                    const isLB = DOM.lightbox.classList.contains('show');
                    const isOverSlider = e.target.closest('.slider-viewport');

                    if ((isLB || isOverSlider) && Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
                        e.preventDefault();
                    }

                    if (isLB) {
                        if (STATE.isLbMoving) { wheelAccumulated = 0; return; }
                        wheelAccumulated += e.deltaX;
                        if (Math.abs(wheelAccumulated) > CONFIG.WHEEL_THRESHOLD.LIGHTBOX) {
                            const direction = wheelAccumulated > 0 ? 1 : -1;
                            wheelAccumulated = 0;
                            changeLbImg(direction);
                        }
                        clearTimeout(wheelTimeout);
                        wheelTimeout = setTimeout(() => { wheelAccumulated = 0; }, CONFIG.TIMING.WHEEL_RESET);
                        return;
                    }

                    if (STATE.isMoving || !isOverSlider) return;
                    wheelAccumulated += e.deltaX;
                    if (Math.abs(wheelAccumulated) > CONFIG.WHEEL_THRESHOLD.SLIDER) {
                        const direction = wheelAccumulated > 0 ? 1 : -1;
                        moveSlide(direction);
                        wheelAccumulated = 0;
                        clearTimeout(wheelTimeout);
                    } else {
                        clearTimeout(wheelTimeout);
                        wheelTimeout = setTimeout(() => { wheelAccumulated = 0; }, CONFIG.TIMING.WHEEL_RESET_SLIDER);
                    }
                }, { passive: false });

                window.addEventListener('mousedown', dragStart);
                window.addEventListener('mouseup', dragEnd);
                window.addEventListener('touchstart', dragStart, { passive: true });
                window.addEventListener('touchend', dragEnd, { passive: true });

                document.getElementById('lb-prev-btn').addEventListener('click', (e) => { e.stopPropagation(); changeLbImg(-1); });
                document.getElementById('lb-next-btn').addEventListener('click', (e) => { e.stopPropagation(); changeLbImg(1); });

                DOM.lightbox.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('lb-arrow')) closeLightbox();
                });

                document.addEventListener('keydown', e => {
                    const isLB = DOM.lightbox.classList.contains('show');
                    if (e.key === 'ArrowRight') isLB ? changeLbImg(1) : moveSlide(1);
                    if (e.key === 'ArrowLeft') isLB ? changeLbImg(-1) : moveSlide(-1);
                    if (e.key === 'Escape' && isLB) closeLightbox();

                    // ✅ [보안 11] 다운로드 관련 단축키 차단
                    const ctrl = e.ctrlKey || e.metaKey;
                    if (ctrl && (e.key === 's' || e.key === 'S')) { e.preventDefault(); } // Ctrl+S 저장
                    if (ctrl && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); } // Ctrl+U 소스보기
                    if (ctrl && e.shiftKey && (e.key === 'i' || e.key === 'I')) { e.preventDefault(); } // Ctrl+Shift+I 개발자도구
                });

                // ✅ [보안 11] 우클릭 컨텍스트 메뉴 차단 (이미지 위 → "다른 이름으로 저장" 방어)
                document.addEventListener('contextmenu', (e) => {
                    if (e.target.tagName === 'IMG' || e.target.closest('.photo-item') || e.target.closest('#lightbox')) {
                        e.preventDefault();
                    }
                });

                // ✅ [보안 11] 이미지 드래그 앤 드롭으로 꺼내기 차단
                document.addEventListener('dragstart', (e) => {
                    if (e.target.tagName === 'IMG') e.preventDefault();
                });
            }

            initGallery();
            bindEvents();
            window.addEventListener('load', () => {
                const loader = document.getElementById('loading-screen');
                setTimeout(() => { loader.classList.add('fade-out'); }, CONFIG.TIMING.LOADING_DELAY);
            });
        })();
    </script>
</body>
