<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src https://fonts.gstatic.com;
        img-src 'self' data:;
        connect-src 'none';
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'none';
    ">

    <meta name="referrer" content="no-referrer">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="description" content="정다운 사진 포트폴리오. 서울 기반 사진.">
    <meta name="keywords" content="정다운, 사진, 포트폴리오, 서울, photography, Jung Daun">
    <meta name="author" content="Jung Daun">

    <title>JUNG DAUN</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --interface-color: #FFFFFF;
            --spacing: 30px;
            --photo-gap: 15px;
            --bg-image: url('assets/000001.webp');
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none; user-select: none;
            -webkit-user-drag: none;
        }

        html, body {
            width: 100%;
            min-height: 100lvh;
            background-color: #000;
            color: var(--interface-color);
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            overscroll-behavior: none;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100lvh;
            background: #000; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .loading-logo {
            font-size: 0.8rem; letter-spacing: 0.3em;
            text-transform: uppercase;
            animation: pulse 1s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        #loading-screen.fade-out {
            opacity: 0; visibility: hidden;
        }

        .bg-fixed {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100lvh;
            background: var(--bg-image) center/cover no-repeat;
            z-index: 0; pointer-events: none; opacity: 0.3;
        }

        nav {
            position: fixed;
            top: calc(var(--spacing) + env(safe-area-inset-top, 0px));
            left: calc(var(--spacing) + env(safe-area-inset-left, 0px));
            z-index: 2000; display: flex; flex-direction: column;
        }

        .logo {
            font-size: 1.5rem; letter-spacing: 0.015em; text-transform: uppercase;
            cursor: pointer; transition: opacity 0.3s; z-index: 2010; font-weight: 200;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .logo:active { opacity: 0.5; }

        .menu-container {
            max-height: 0; overflow: hidden; opacity: 0;
            transition: max-height 0.7s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, margin-top 0.7s ease;
            pointer-events: none;
        }
        .menu-container.show { max-height: 500px; opacity: 1; pointer-events: auto; margin-top: 30px; }
        .menu-item { margin-bottom: 25px; }
        .menu-label { font-size: 0.68rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; display: block; font-weight: 100; }
        .menu-content { font-size: 0.85rem; line-height: 1.6; opacity: 1; font-weight: 300; user-select: text; -webkit-user-select: text; cursor: auto; text-shadow: 0 1px 5px rgba(0,0,0,0.8); }

        /* --- 갤러리 레이아웃 (너비 10% 축소 및 중앙 정렬) --- */
        #gallery-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            gap: var(--photo-gap);
            padding: calc(var(--spacing) * 4 + env(safe-area-inset-top, 0px)) var(--spacing) calc(var(--spacing) * 3);
            width: 90%;
            margin: 0 auto;
            box-sizing: border-box;
            align-content: flex-start;
        }

        /* --- 각 사진 아이템 (높이 2/3로 축소) --- */
        .gallery-item {
            flex: 1 1 auto;
            height: 230px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            vertical-align: middle;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .gallery-item:hover img {
            transform: scale(1.03);
        }

        #gallery-container::after {
            content: '';
            flex-grow: 999999999;
            min-width: 200px;
            height: 0;
        }

        /* --- 라이트박스 --- */
        #lightbox {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100lvh;
            background: rgba(0, 0, 0, 0.98);
            display: none; justify-content: center; align-items: center;
            z-index: 3000; opacity: 0; transition: opacity 0.4s ease; cursor: pointer;
            touch-action: pan-y; overscroll-behavior-x: none;
        }
        #lightbox.show { display: flex; opacity: 1; }
        #lightbox-img { max-width: 90vw; max-height: 90vh; object-fit: contain; z-index: 3050; transition: opacity 0.3s ease; }

        .lb-arrow {
            position: absolute; top: 0; bottom: 0; width: 15vw; min-width: 80px;
            display: flex; align-items: center; justify-content: center;
            z-index: 3600; opacity: 0.3; cursor: pointer; transition: opacity 0.3s ease;
        }
        .lb-arrow::after { content: ''; width: 15px; height: 15px; border-top: 1.5px solid #fff; border-right: 1.5px solid #fff; }
        .lb-prev { left: 0; justify-content: flex-start; padding-left: calc(30px + env(safe-area-inset-left, 0px)); }
        .lb-prev::after { transform: rotate(-135deg); }
        .lb-next { right: 0; justify-content: flex-end; padding-right: calc(30px + env(safe-area-inset-right, 0px)); }
        .lb-next::after { transform: rotate(45deg); }
        #lightbox:hover .lb-arrow { opacity: 0.65; }
        .lb-arrow:hover { opacity: 1 !important; }

        footer {
            position: fixed;
            bottom: calc(var(--spacing) + env(safe-area-inset-bottom, 0px));
            right: var(--spacing); font-size: 0.6rem; opacity: 0.5; z-index: 1000;
        }

        /* --- 반응형 (모바일) --- */
        @media (max-width: 850px) {
            :root {
                --spacing: 16px;
                --photo-gap: 8px;
            }
            #gallery-container { 
                width: 95%; 
                padding-top: calc(80px + env(safe-area-inset-top, 0px)); 
            }
            .gallery-item {
                height: 120px;
            }
            nav {
                top: calc(18px + env(safe-area-inset-top, 0px));
                flex-direction: row; align-items: flex-start; gap: 11px;
            }
            .logo { font-size: 1.3rem; text-shadow: 0 1px 5px rgba(0,0,0,0.8); }
            .lb-arrow { display: none; }
        }
    </style>
</head>

<body>

    <div id="loading-screen">
        <div class="loading-logo">RELOAD A ROLL...</div>
    </div>

    <div class="bg-fixed"></div>

    <nav>
        <h1 class="logo" data-action="toggle-menu">JUNG DAUN</h1>
        <div id="dropdown-menu" class="menu-container">
            <div>
                <div class="menu-item">
                    <span class="menu-label">About</span>
                    <div class="menu-content">Shooting and editing photos,<br>based in Seoul.</div>
                </div>
                <div class="menu-item">
                    <span class="menu-label">Contact</span>
                    <div class="menu-content">
                        <a href="mailto:10yds730@gmail.com" style="color:inherit;text-decoration:none;">10yds730@gmail.com</a><br>
                        <a href="https://instagram.com/down01234" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;">@down01234</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main id="gallery-container"></main>

    <div id="lightbox">
        <div class="lb-arrow lb-prev" id="lb-prev-btn" aria-label="이전 사진"></div>
        <img id="lightbox-img" alt="Enlarged View">
        <div class="lb-arrow lb-next" id="lb-next-btn" aria-label="다음 사진"></div>
    </div>

    <footer>
        <p>© 2026 JUNG DAUN.</p>
    </footer>

    <script>
        (function () {
            'use strict';

            const ALL_IMAGES = [
                'assets/A1.webp', 'assets/A2.webp', 'assets/A4.webp', 'assets/A3.webp',
                'assets/B1.webp', 'assets/B2.webp', 'assets/B4.webp', 'assets/B3.webp',
                'assets/C1.webp', 'assets/C2.webp', 'assets/C3.webp', 'assets/C4.webp'
            ];

            const STATE = {
                lbIndex: 0,
                isLbMoving: false,
                startX: 0,
                isDragging: false
            };

            const DOM = {
                gallery: document.getElementById('gallery-container'),
                lightbox: document.getElementById('lightbox'),
                lightboxImg: document.getElementById('lightbox-img'),
                menu: document.getElementById('dropdown-menu'),
                loader: document.getElementById('loading-screen')
            };

            function initGallery() {
                const fragment = document.createDocumentFragment();

                ALL_IMAGES.forEach((src, idx) => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    item.style.animationDelay = `${idx * 0.05}s`;

                    const img = document.createElement('img');
                    img.src = src;
                    img.alt = `Portfolio Image ${idx + 1}`;
                    img.loading = "lazy";
                    
                    item.appendChild(img);
                    fragment.appendChild(item);
                });

                DOM.gallery.appendChild(fragment);
            }

            function openLightbox(src) {
                const index = ALL_IMAGES.indexOf(src);
                if (index === -1) return;
                
                STATE.lbIndex = index;
                DOM.lightboxImg.src = ALL_IMAGES[STATE.lbIndex];
                DOM.lightboxImg.style.opacity = '1';
                DOM.lightbox.style.display = 'flex';
                
                requestAnimationFrame(() => {
                    setTimeout(() => DOM.lightbox.classList.add('show'), 10);
                });
            }

            function changeLbImg(direction) {
                if (STATE.isLbMoving) return;
                STATE.isLbMoving = true;

                DOM.lightboxImg.style.opacity = '0';
                setTimeout(() => {
                    STATE.lbIndex = (STATE.lbIndex + direction + ALL_IMAGES.length) % ALL_IMAGES.length;
                    DOM.lightboxImg.src = ALL_IMAGES[STATE.lbIndex];
                    DOM.lightboxImg.style.opacity = '1';
                    
                    setTimeout(() => { STATE.isLbMoving = false; }, 300);
                }, 300);
            }

            function closeLightbox() {
                DOM.lightbox.classList.remove('show');
                setTimeout(() => { DOM.lightbox.style.display = 'none'; }, 400);
            }

            function bindEvents() {
                document.addEventListener('click', (e) => {
                    if (e.target.closest('[data-action="toggle-menu"]')) {
                        DOM.menu.classList.toggle('show');
                        return;
                    }

                    const galleryItem = e.target.closest('.gallery-item');
                    if (galleryItem) {
                        const img = galleryItem.querySelector('img');
                        if (img) openLightbox(img.getAttribute('src'));
                        return;
                    }
                });

                document.getElementById('lb-prev-btn').addEventListener('click', (e) => { e.stopPropagation(); changeLbImg(-1); });
                document.getElementById('lb-next-btn').addEventListener('click', (e) => { e.stopPropagation(); changeLbImg(1); });
                
                DOM.lightbox.addEventListener('click', (e) => {
                    if (e.target.id === 'lightbox' || e.target.id === 'lightbox-img') closeLightbox();
                });

                document.addEventListener('keydown', (e) => {
                    const isLB = DOM.lightbox.classList.contains('show');
                    if (!isLB) return;

                    if (e.key === 'ArrowRight') changeLbImg(1);
                    if (e.key === 'ArrowLeft') changeLbImg(-1);
                    if (e.key === 'Escape') closeLightbox();
                });

                const dragStart = (e) => {
                    if (!DOM.lightbox.classList.contains('show')) return;
                    STATE.isDragging = true;
                    STATE.startX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
                };

                const dragEnd = (e) => {
                    if (!STATE.isDragging) return;
                    STATE.isDragging = false;
                    const endX = e.type.startsWith('touch') ? e.changedTouches[0].clientX : e.clientX;
                    const diffX = STATE.startX - endX;

                    if (Math.abs(diffX) > 40) {
                        changeLbImg(diffX > 0 ? 1 : -1);
                    }
                };

                DOM.lightbox.addEventListener('mousedown', dragStart);
                DOM.lightbox.addEventListener('mouseup', dragEnd);
                DOM.lightbox.addEventListener('touchstart', dragStart, { passive: true });
                DOM.lightbox.addEventListener('touchend', dragEnd, { passive: true });

                document.addEventListener('contextmenu', (e) => e.preventDefault());
                document.addEventListener('dragstart', (e) => {
                    if (e.target.tagName === 'IMG') e.preventDefault();
                });
            }

            initGallery();
            bindEvents();

            window.addEventListener('load', () => {
                setTimeout(() => { DOM.loader.classList.add('fade-out'); }, 500);
            });
        })();
    </script>
</body>
</html>
